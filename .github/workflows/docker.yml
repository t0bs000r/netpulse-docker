name: docker

# Publishes the NetPulse server image to GHCR for every architecture
# upstream ships (linux/amd64, linux/arm64, linux/arm/v7).
#
# A new image is only pushed when gnacho/netpulse has a stable release that
# is not on GHCR yet:
# - schedule: checks upstream every 6 hours.
# - workflow_dispatch: same check by hand; `force` rebuilds an existing tag.
# - push / pull_request touching the image: build + smoke test only, never
#   pushes, so changes are verified before the next release ships them.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'NetPulse version (e.g. 2.43.0). Empty = latest release.'
        required: false
        default: ''
      force:
        description: 'Rebuild and push even if the tag already exists.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/docker.yml]
  pull_request:
    paths: [Dockerfile, .github/workflows/docker.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM: gnacho/netpulse
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netpulse"
          # Newest stable server release. Upstream also tags agent releases
          # (agent/vX) and a rolling go-latest prerelease; skip both.
          latest=$(gh api "repos/${UPSTREAM}/releases?per_page=30" \
            --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))][0].tag_name')
          latest="${latest#v}"
          [ -n "$latest" ] || { echo "::error::no upstream release found"; exit 1; }

          version="${INPUT_VERSION#v}"
          version="${version:-$latest}"

          case "$GITHUB_EVENT_NAME" in
            push|pull_request) publish=false; build=true ;;
            *)
              publish=true; build=true
              if [ "$FORCE" != "true" ] \
                 && docker buildx imagetools inspect "${image}:${version}" >/dev/null 2>&1; then
                echo "${image}:${version} is already published; nothing to do."
                publish=false; build=false
              fi ;;
          esac

          {
            echo "version=${version}"
            echo "image=${image}"
            echo "build=${build}"
            echo "publish=${publish}"
            echo "latest=$([ "$version" = "$latest" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "upstream latest ${latest}, version ${version}, build ${build}, publish ${publish}"

      - if: steps.v.outputs.build == 'true'
        uses: actions/checkout@v7

      - if: steps.v.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4

      - if: steps.v.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 for smoke test
        if: steps.v.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: NETPULSE_VERSION=${{ steps.v.outputs.version }}
          load: true
          tags: netpulse:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.v.outputs.build == 'true'
        run: |
          set -euo pipefail
          # Expect exactly two layers: the unmodified Alpine base, then one
          # layer with packages, user and the netpulse binary.
          alpine=$(sed -n 's/^ARG ALPINE_VERSION=//p' Dockerfile)
          docker pull -q "alpine:${alpine}" >/dev/null
          base=$(docker image inspect "alpine:${alpine}" --format '{{json .RootFS.Layers}}')
          layers=$(docker image inspect netpulse:smoke --format '{{json .RootFS.Layers}}')
          echo "alpine ${alpine} base: ${base}"
          echo "image layers: ${layers}"
          [ "$(echo "$layers" | jq length)" -eq 2 ] \
            || { echo "::error::expected 2 layers, got $(echo "$layers" | jq length)"; exit 1; }
          [ "$(echo "$layers" | jq -r '.[0]')" = "$(echo "$base" | jq -r '.[0]')" ] \
            || { echo "::error::first layer is not the unmodified alpine:${alpine} base"; exit 1; }
          docker run --rm --entrypoint sh netpulse:smoke -c \
            'command -v ssh ssh-keygen ssh-keyscan ip wget && echo 192.168.1.2 | grep -oP "\d+\.\d+"'
          docker run -d --name smoke -e AUTH_PASS=smoke-test-pass -e DEMO_MODE=1 netpulse:smoke
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs smoke
          docker exec smoke wget -qO- http://127.0.0.1:3000/api/health
          [ "$status" = healthy ] || { echo "::error::container never became healthy"; exit 1; }
          docker rm -f smoke

      - id: meta
        if: steps.v.outputs.publish == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.latest }}
            type=semver,pattern={{major}},value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.latest }}
            type=raw,value=latest,enable=${{ steps.v.outputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build all platforms
        if: steps.v.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: NETPULSE_VERSION=${{ steps.v.outputs.version }}
          push: ${{ steps.v.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags || 'netpulse:ci' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
